services:
  - type: web
    name: survivor-worker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn worker.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: TICK_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COINDCX_API_KEY
        sync: false
      - key: COINDCX_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WALLET_SMALL_STARTING_CAPITAL
        value: "10000"
      - key: WALLET_LARGE_STARTING_CAPITAL
        value: "10000"
      - key: DEATH_THRESHOLD_PCT
        value: "20"
